name: CI - Validação Terraform e Manifests K8s

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 3. terraform fmt -check
        run: terraform fmt -check -recursive

      - name: 4. Autenticar no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 5. terraform init
        run: terraform init

      - name: 6. terraform validate
        run: terraform validate

      - name: 7. terraform plan (só leitura, não aplica)
        if: github.event_name == 'pull_request'
        run: terraform plan

  k8s-manifests-lint:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Validar sintaxe YAML dos manifests
        run: |
          for f in $(find k8s -name "*.yaml"); do
            python3 -c "import yaml,sys; list(yaml.safe_load_all(open(sys.argv[1])))" "$f" || exit 1
          done

  # terraform apply, kubectl apply dos manifests e o `helm upgrade --install`
  # continuam manuais nesta fase — ver seção "Por que o terraform apply é
  # manual" no README.md.
