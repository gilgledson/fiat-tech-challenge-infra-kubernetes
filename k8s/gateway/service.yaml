apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: gateway
  annotations:
    # Nome público gratuito da Azure para o IP do gateway:
    # oficina-fiap.brazilsouth.cloudapp.azure.com. É o domínio do certificado HTTPS e do
    # webhook do Mercado Pago.
    service.beta.kubernetes.io/azure-dns-label-name: oficina-fiap
spec:
  type: LoadBalancer
  selector:
    app: traefik
  ports:
    - name: web
      protocol: TCP
      port: 80
      targetPort: 80
    - name: websecure
      protocol: TCP
      port: 443
      targetPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-dashboard
  namespace: gateway
spec:
  type: ClusterIP
  selector:
    app: traefik
  ports:
    - name: dashboard
      protocol: TCP
      port: 8080
      targetPort: 8080
